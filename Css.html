<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glitch Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #07040a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Фоновая сетка */
            background-image: 
                linear-gradient(rgba(138, 43, 226, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- ЛОГОТИП --- */
        .logo-container {
            margin-bottom: 15px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #b366ff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            animation: glitch-anim 3s infinite;
        }

        .subtitle {
            font-size: 10px;
            color: #8a2be2;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            margin-top: 5px;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            2% { transform: translate(-2px, 2px); }
            4% { transform: translate(-2px, -2px); }
            6% { transform: translate(2px, 2px); }
            8% { transform: translate(2px, -2px); }
            10% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        /* --- ХЕДЕР И БАЛАНС --- */
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(20, 10, 35, 0.8);
            border-radius: 15px;
            border: 1px solid rgba(138, 43, 226, 0.5);
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }

        .user-info {
            font-size: 14px;
            font-weight: 600;
        }

        .user-info span {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .balance {
            font-size: 16px;
            color: #00ffff;
            font-weight: 900;
            background: rgba(0, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        /* --- КЕЙС --- */
        .case-container {
            width: 100%;
            max-width: 320px;
            height: 320px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(138, 43, 226, 0.2) 0%, rgba(7, 4, 10, 0.95) 100%);
            border: 2px solid rgba(255, 0, 255, 0.5);
            box-shadow: 
                0 0 40px rgba(255, 0, 255, 0.2), 
                inset 0 0 30px rgba(255, 0, 255, 0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Бегущая неоновая линия */
        .case-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff00ff, #00ffff, transparent);
            animation: scanline 2s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .prize {
            font-size: 100px;
            transition: transform 0.05s;
            filter: drop-shadow(0 0 25px rgba(255, 0, 255, 0.8));
            z-index: 2;
        }

        /* --- КНОПКА --- */
        .open-btn {
            background: linear-gradient(45deg, #8a2be2, #4b0082);
            border: 2px solid #b366ff;
            border-radius: 20px;
            padding: 20px 40px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            transition: all 0.2s;
            width: 100%;
            max-width: 320px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .open-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(138, 43, 226, 1);
        }

        .open-btn:disabled {
            border-color: #333;
            color: #666;
            background: #1a1a1a;
            box-shadow: none;
        }

        /* --- ТОСТ (Уведомление) --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 0, 255, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            transition: transform 0.3s ease-in-out;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo">Glitch Drop</div>
        <div class="subtitle">Лови свой редкий дроп</div>
    </div>

    <div class="header">
        <div class="user-info">👤 <span id="username">Игрок</span></div>
        <div class="balance" id="balance">💎 0</div>
    </div>

    <div class="case-container" id="case-box">
        <div class="prize" id="prize">🎁</div>
    </div>

    <button class="open-btn" id="open-button" onclick="openCase()">Открыть кейс (10 💎)</button>

    <div class="toast" id="toast">Недостаточно кристаллов!</div>

    <script>
        // Инициализация Telegram WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); 
        
        // Получаем данные пользователя
        const user = Telegram.WebApp.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').innerText = user.first_name;
        }

        // Игровая логика
        let balance = 50; 
        const balanceElement = document.getElementById('balance');
        const prizeElement = document.getElementById('prize');
        const button = document.getElementById('open-button');
        const toast = document.getElementById('toast');

        // Призы
        const prizes = ['🎁', '🌹', '🧸', '🚀', '💎', '🐶', '🔥', '👾', '👑', '💣'];

        function updateBalance() {
            balanceElement.innerText = `💎 ${balance}`;
        }

        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function openCase() {
            if (balance < 10) {
                showToast("❌ Недостаточно кристаллов!");
                // Вибрация при ошибке
                Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                return;
            }

            // Списываем средства
            balance -= 10;
            updateBalance();
            
            // Блокируем кнопку
            button.disabled = true;
            button.innerText = "КРУТИМ...";

            // Вибрация при начале
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');

            let spins = 0;
            
            // Запускаем анимацию кручения
            const spinInterval = setInterval(() => {
                // Меняем эмодзи
                prizeElement.innerText = prizes[Math.floor(Math.random() * prizes.length)];
                
                // Эффект глитча (сдвигаем по X и Y)
                prizeElement.style.transform = `translate(${Math.random() * 30 - 15}px, ${Math.random() * 30 - 15}px) scale(${1 + Math.random() * 0.2})`;
                
                spins++;
            }, 50);

            // Останавливаем через 2.5 секунды
            setTimeout(() => {
                clearInterval(spinInterval);
                
                // Резкий возврат в центр
                prizeElement.style.transform = 'translate(0, 0) scale(1)';

                // Выбираем финальный приз
                const winIndex = Math.floor(Math.random() * prizes.length);
                const winPrize = prizes[winIndex];
                prizeElement.innerText = winPrize;

                // Возвращаем кнопку
                button.disabled = false;
                button.innerText = "ОТКРЫТЬ КЕЙС (10 💎)";
                
                // Логика призов
                if (winPrize === '💎') {
                    balance += 20;
                    updateBalance();
                    showToast("🎉 Ты выиграл 20 Кристаллов!");
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else if (winPrize === '👑' || winPrize === '👾') {
                    showToast(`🔥 РЕДКИЙ ДРОП: ${winPrize}!`);
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                } else {
                    showToast(`Ты выбил: ${winPrize}`);
                }

            }, 2500);
        }

        // Первичная отрисовка
        updateBalance();
    </script>
</body>
</html>
